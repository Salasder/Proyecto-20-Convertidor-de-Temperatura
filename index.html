<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convertidor de Temperatura</title>
    <link rel="stylesheet" href="estilos.css">
</head>

<body>

    <main class="contenedor-principal">

        <header class="encabezado">
            <h1>Convertidor de Temperatura</h1>
            <p>Convierte temperaturas entre diferentes unidades</p>
        </header>

        <form class="formulario" id="formulario-conversion">

            <div class="campo">
                <label for="temperatura">Temperatura</label>
                <input type="number" id="temperatura" placeholder="Ingresa una temperatura" step="any" required>
            </div>

            <div class="campo">
                <label for="unidad-origen">Convertir de:</label>
                <select id="unidad-origen" required>
                    <option value="">Selecciona una unidad</option>
                    <option value="celsius">Celsius (°C)</option>
                    <option value="fahrenheit">Fahrenheit (°F)</option>
                    <option value="kelvin">Kelvin (K)</option>
                </select>
            </div>

            <div class="campo">
                <label for="unidad-destino">Convertir a:</label>
                <select id="unidad-destino" required>
                    <option value="">Selecciona una unidad</option>
                    <option value="celsius">Celsius (°C)</option>
                    <option value="fahrenheit">Fahrenheit (°F)</option>
                    <option value="kelvin">Kelvin (K)</option>
                </select>
            </div>

            <button type="submit" id="boton-convertir" disabled>
                Convertir
            </button>

        </form>

        <section class="resultado" id="resultado" aria-live="polite">
            <h2>Resultado</h2>
            <p id="valor-convertido">
                Aquí aparecerá la temperatura convertida.
            </p>
        </section>

    </main>

    <script src="javascript.js"></script>
</body>

</html>
